name: reto-poc

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mock-api:
    build: .
    command: uvicorn app.mock_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  orchestrator:
    build: .
    command: uvicorn app.orchestrator:app --host 0.0.0.0 --port 8000
    environment:
      MOCK_API_URL: http://mock-api:8000
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      mock-api:
        condition: service_healthy
