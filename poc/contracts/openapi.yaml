openapi: 3.0.3
info:
  title: Plataforma de Automatización — API síncrona
  version: 1.0.0
  description: >
    Contrato mínimo del orquestador (disparador webhook) y de un componente
    reutilizable de ejemplo (consulta-cliente). Los procesos consumen los
    componentes por este contrato estable; romper compatibilidad implica un
    MAJOR y ventana de coexistencia.
servers:
  - url: http://localhost:8000
    description: PoC local (orquestador)
paths:
  /webhook:
    post:
      operationId: procesarPago
      summary: Dispara el proceso "procesar_pago" (saga con reintentos/compensación).
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagoRequest"
      responses:
        "200":
          description: Resultado de la ejecución (éxito o fallo controlado).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EjecucionResult"
        "401":
          description: API key inválida o ausente.
  /clientes/{documento}:
    get:
      operationId: consultarCliente
      summary: Componente reutilizable "consulta-cliente@2.3.1".
      parameters:
        - name: documento
          in: path
          required: true
          schema: { type: string, example: "1020304050" }
        - name: X-Correlation-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Datos básicos del cliente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cliente"
        "404": { description: Cliente no encontrado (error permanente). }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PagoRequest:
      type: object
      required: [cuenta, monto]
      properties:
        cuenta: { type: string, example: "1234567", description: "Se enmascara en logs/traza." }
        monto: { type: number, minimum: 0.01, maximum: 50000000, example: 100000 }
        modo:
          type: string
          enum: [ok, transitorio, permanente]
          default: ok
          description: "Solo PoC: fuerza el comportamiento del sistema destino simulado."
    EjecucionResult:
      type: object
      properties:
        correlationId: { type: string, format: uuid }
        status: { type: string, enum: [OK, FAILED] }
        deadLettered: { type: boolean }
        compensados: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        referencia: { type: string, nullable: true }
        cuenta: { type: string, example: "***4567", description: "PII enmascarada." }
    Cliente:
      type: object
      properties:
        documento: { type: string }
        nombre: { type: string }
        segmento: { type: string, enum: [personas, pyme, empresas] }
