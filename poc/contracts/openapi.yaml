openapi: 3.0.3
info:
  title: Automation Platform - Synchronous API
  version: 1.0.0
  description: >
    Minimal reference contract for the orchestrator webhook and a reusable
    customer lookup component. The PoC accepts Spanish field aliases for the
    challenge examples, while the canonical technical names are English.
servers:
  - url: http://localhost:8000
    description: Local PoC orchestrator
paths:
  /webhook:
    post:
      operationId: processPayment
      summary: Runs the process_payment saga with retries and compensation.
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentRequest"
      responses:
        "200":
          description: Controlled execution result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionResult"
        "401":
          description: API key is invalid or missing.
  /customers/{document}:
    get:
      operationId: getCustomer
      summary: Reusable component "customer-lookup@2.3.1".
      parameters:
        - name: document
          in: path
          required: true
          schema: { type: string, example: "1020304050" }
        - name: X-Correlation-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Basic customer data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404": { description: Customer was not found. }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PaymentRequest:
      type: object
      required: [account, amount]
      properties:
        account: { type: string, example: "1234567", description: "Masked in logs and traces." }
        amount: { type: number, minimum: 0.01, maximum: 50000000, example: 100000 }
        mode:
          type: string
          enum: [ok, transient, permanent]
          default: ok
          description: "PoC-only switch that forces the mock target behavior."
        cuenta: { type: string, deprecated: true, description: "Legacy alias for account." }
        monto: { type: number, deprecated: true, description: "Legacy alias for amount." }
        modo: { type: string, deprecated: true, description: "Legacy alias for mode." }
    ExecutionResult:
      type: object
      properties:
        correlationId: { type: string, format: uuid }
        status: { type: string, enum: [OK, FAILED] }
        deadLettered: { type: boolean }
        compensated: { type: array, items: { type: string } }
        error: { type: string, nullable: true }
        reference: { type: string, nullable: true }
        account: { type: string, example: "***4567", description: "Masked PII." }
        trace: { type: array, items: { type: object } }
        compensados: { type: array, deprecated: true, items: { type: string } }
        referencia: { type: string, deprecated: true, nullable: true }
        cuenta: { type: string, deprecated: true, example: "***4567" }
    Customer:
      type: object
      properties:
        document: { type: string }
        name: { type: string }
        segment: { type: string, enum: [personal, smb, enterprise] }
