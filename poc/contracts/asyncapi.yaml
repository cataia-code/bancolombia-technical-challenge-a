asyncapi: 2.6.0
info:
  title: Event Bus - Automation
  version: 1.0.0
  description: >
    Reference contract for an event-driven backbone with schema versioning,
    idempotency, ordering by correlationId, and a dead-letter channel.
defaultContentType: application/json
servers:
  local:
    url: localhost:6379
    protocol: redis
    description: Local PoC. A production setup would use Kafka or RabbitMQ.
channels:
  execution.events:
    description: Correlated execution lifecycle events.
    parameters:
      orderingKey:
        description: Partitioning and ordering key, usually correlationId.
        schema: { type: string }
    subscribe:
      message:
        $ref: "#/components/messages/ExecutionEvent"
  execution.dlq:
    description: Unrecoverable messages after permanent failures or exhausted retries.
    subscribe:
      message:
        $ref: "#/components/messages/DeadLetterMessage"
components:
  messages:
    ExecutionEvent:
      name: ExecutionEvent
      headers:
        type: object
        required: [schemaVersion, correlationId, idempotencyKey]
        properties:
          schemaVersion: { type: string, example: "1.0" }
          correlationId: { type: string, format: uuid }
          idempotencyKey: { type: string }
      payload:
        type: object
        required: [event, correlationId]
        properties:
          event:
            type: string
            enum: [INPUT, START, EXECUTE, RETRY, COMPENSATE, COMPENSATION_FAILED, DLQ, OUTPUT, SKIP_IDEMPOTENT]
          correlationId: { type: string, format: uuid }
          process: { type: string, example: process_payment }
          step: { type: string, example: payment_execution }
          inputHash: { type: string, description: "Input hash. Raw PII must never be logged." }
    DeadLetterMessage:
      name: DeadLetterMessage
      payload:
        type: object
        required: [correlationId, process, failedStep, error]
        properties:
          correlationId: { type: string, format: uuid }
          process: { type: string }
          failedStep: { type: string }
          error: { type: string }
          errorType: { type: string, enum: [PermanentError, TransientError] }
