# Reusable component manifest for the technical catalog.
apiVersion: catalog/v1
kind: Component
metadata:
  name: customer-lookup
  version: 2.3.1
  owner: squad-customers
  contact: "#customers-channel"
  status: active
  tags: [customers, read, core]
spec:
  description: Retrieves basic customer data by document number.
  contract:
    type: openapi
    ref: ./openapi.yaml
    operation: getCustomer
  consumers:
    - account-opening-process
    - customer-data-update-process
    - credit-origination-process
  sla:
    availability: "99.9%"
    p95_latency_ms: 300
  observability:
    correlated: true
    metrics: [success, latency, retries]
  changelog:
    - version: 2.3.1
      change: "Fixes document normalization for hyphenated values."
      breaking: false
    - version: 2.3.0
      change: "Adds the response field 'segment'."
      breaking: false
    - version: 2.0.0
      change: "Changes the response format to an envelope."
      breaking: true
  deprecation:
    replaces: null
    sunset: null
